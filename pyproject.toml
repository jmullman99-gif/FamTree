[project]
name = "genealogy-mcp"
version = "0.1.0"
description = "AI-powered genealogy research toolkit — WikiTree, GEDCOM, newspapers, and European archives in one MCP server"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27",
]

[project.scripts]
genealogy-mcp = "genealogy_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genealogy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
